
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#174c3c">
<title>Deutsch – Viet Wörterbuch</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f6f4;color:#20352c}
header{background:#174c3c;color:white;padding:25px 18px}
header h1{margin:0 0 8px;font-size:23px}
header p{margin:0;color:#d7e8df}
main{max-width:650px;margin:auto;padding:18px}
input,button{font-size:16px;border-radius:10px;padding:13px}
input{width:100%;border:1px solid #ccd8d0;background:white;margin:10px 0}
button{border:0;background:#174c3c;color:white;cursor:pointer}
.card{background:white;padding:17px;border-radius:14px;margin-top:14px;box-shadow:0 2px 8px #0000000d}
.word{font-size:23px;font-weight:bold;color:#174c3c}
.meta{color:#64756c;font-size:14px;margin:7px 0}
.section{margin-top:12px;line-height:1.5}
.actions{display:flex;gap:8px;margin-top:12px}
.secondary{background:#e5eee8;color:#174c3c}
#message{color:#64756c;margin-top:12px}
footer{text-align:center;color:#829087;font-size:12px;padding:25px}
</style>
</head>
<body>
<header>
<h1>🇩🇪 Deutsch – Viet Wörterbuch</h1>
<p>Từ điển tiếng Đức offline · Deutsch – Việt</p>
</header>
<main>
<h3>🔎 Tra cứu từ vựng</h3>
<input id="search" placeholder="Nhập từ tiếng Đức hoặc tiếng Việt...">
<div id="results"></div>
<p id="message">Nhập từ để bắt đầu tra cứu.</p>
<div class="card">
<h3>⭐ Từ đã lưu</h3>
<div id="saved">Chưa có từ nào được lưu.</div>
</div>
</main>
<footer>Phiên bản 1.0 · Deutsch – Viet Wörterbuch</footer>
<script>
const words=[
{word:"die Haut",plural:"die Häute",type:"Substantiv",vi:"Da, làn da",en:"Skin",definition:"Die äußere Hülle des menschlichen oder tierischen Körpers.",synonyms:"—",example:"Die Haut schützt den Körper vor äußeren Einflüssen."},
{word:"die Pflege",plural:"—",type:"Substantiv",vi:"Sự chăm sóc",en:"Care",definition:"Maßnahmen zur Unterstützung, Erhaltung und Förderung des Wohlbefindens.",synonyms:"Betreuung, Versorgung",example:"Die Pflege eines älteren Menschen erfordert Geduld."},
{word:"das Wasser",plural:"—",type:"Substantiv",vi:"Nước",en:"Water",definition:"Eine farblose, geruchlose Flüssigkeit, die für das Leben notwendig ist.",synonyms:"—",example:"Der Mensch braucht täglich Wasser."},
{word:"der Dekubitus",plural:"die Dekubitalgeschwüre",type:"Substantiv",vi:"Loét do tì đè",en:"Pressure ulcer",definition:"Eine örtlich begrenzte Schädigung der Haut und des darunterliegenden Gewebes durch anhaltenden Druck oder Druck in Verbindung mit Scherkräften.",synonyms:"Druckgeschwür",example:"Regelmäßige Bewegung kann das Dekubitusrisiko verringern."},
{word:"die Atmung",plural:"—",type:"Substantiv",vi:"Sự hô hấp",en:"Respiration",definition:"Die Aufnahme von Sauerstoff und die Abgabe von Kohlendioxid.",synonyms:"Respiration",example:"Die Atmung wird regelmäßig beobachtet."},
{word:"die Hautpflege",plural:"—",type:"Substantiv",vi:"Chăm sóc da",en:"Skin care",definition:"Maßnahmen zur Reinigung und Pflege der Haut.",synonyms:"Hautversorgung",example:"Eine regelmäßige Hautpflege ist wichtig."},
{word:"das Ödem",plural:"die Ödeme",type:"Substantiv",vi:"Phù, tình trạng tích tụ dịch trong mô",en:"Edema",definition:"Eine Ansammlung von Flüssigkeit im Gewebe.",synonyms:"Gewebeschwellung",example:"Das Ödem ist am Unterschenkel sichtbar."},
{word:"die Entzündung",plural:"die Entzündungen",type:"Substantiv",vi:"Viêm",en:"Inflammation",definition:"Eine Reaktion des Körpers auf schädliche Reize.",synonyms:"Inflammatorische Reaktion",example:"Die Entzündung verursacht Schmerzen und Rötung."},
{word:"der Schmerz",plural:"die Schmerzen",type:"Substantiv",vi:"Cơn đau",en:"Pain",definition:"Eine unangenehme Sinnes- und Gefühlsempfindung.",synonyms:"Pein",example:"Der Patient klagt über starke Schmerzen."},
{word:"die Bewegung",plural:"die Bewegungen",type:"Substantiv",vi:"Sự vận động",en:"Movement",definition:"Eine Veränderung der Lage oder Position des Körpers.",synonyms:"Mobilität, Aktivität",example:"Regelmäßige Bewegung ist gesund."}
];

let saved=JSON.parse(localStorage.getItem("savedWords")||"[]");

function showSaved(){
const box=document.getElementById("saved");
box.replaceChildren();
if(!saved.length){box.textContent="Chưa có từ nào được lưu.";return;}
saved.forEach(word=>{
const item=document.createElement("div");
item.textContent="⭐ "+word;
item.style.padding="7px 0";
box.appendChild(item);
});
}

function showResults(list){
const results=document.getElementById("results");
results.replaceChildren();
if(!list.length){
document.getElementById("message").textContent="Không tìm thấy từ này.";
return;
}
document.getElementById("message").textContent="Tìm thấy "+list.length+" từ.";
list.forEach(w=>{
const card=document.createElement("div");
card.className="card";
const title=document.createElement("div");
title.className="word";
title.textContent=w.word;
card.appendChild(title);
const meta=document.createElement("div");
meta.className="meta";
meta.textContent=w.type+" · Plural: "+w.plural;
card.appendChild(meta);
[
["🇻🇳 Tiếng Việt",w.vi],
["🇬🇧 English",w.en],
["📖 Erklärung auf Deutsch",w.definition],
["🔁 Synonyme",w.synonyms],
["💬 Beispiel",w.example]
].forEach(([label,value])=>{
const section=document.createElement("div");
section.className="section";
const strong=document.createElement("strong");
strong.textContent=label+": ";
section.append(strong,document.createTextNode(value));
card.appendChild(section);
});
const button=document.createElement("button");
button.className="secondary";
button.textContent=saved.includes(w.word)?"★ Đã lưu":"☆ Lưu từ";
button.addEventListener("click",()=>{
if(saved.includes(w.word)){saved=saved.filter(x=>x!==w.word);}
else{saved.push(w.word);}
localStorage.setItem("savedWords",JSON.stringify(saved));
showSaved();
showResults(list);
});
const actions=document.createElement("div");
actions.className="actions";
actions.appendChild(button);
card.appendChild(actions);
results.appendChild(card);
});
}

document.getElementById("search").addEventListener("input",e=>{
const q=e.target.value.trim().toLocaleLowerCase();
if(!q){
document.getElementById("results").replaceChildren();
document.getElementById("message").textContent="Nhập từ để bắt đầu tra cứu.";
return;
}
showResults(words.filter(w=>
[w.word,w.vi,w.en,w.type,w.definition,w.synonyms]
.some(x=>x.toLocaleLowerCase().includes(q))
));
});
showSaved();
</script>
</body>
</html>
